<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#203a43">
<title>LibraryHub Ver.1.3</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#17202a;--muted:#566573;--main:#203a43;--sub:#2c5364;--accent:#e6a23c;--line:#d7e0e3;--danger:#b03a2e;--success:#1e8449}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
header{padding:22px 18px;color:#fff;background:linear-gradient(135deg,var(--main),var(--sub));position:sticky;top:0;z-index:10;box-shadow:0 3px 12px rgba(0,0,0,.16)}
header h1{margin:0;font-size:28px} header p{margin:2px 0 0;font-weight:700;opacity:.9}
main{width:min(980px,100%);margin:auto;padding:18px}
.panel,.book{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px rgba(31,52,59,.08)}
.panel{padding:18px;margin-bottom:18px}
h2{margin:0 0 12px;font-size:23px}
label{display:block;font-weight:900;margin:12px 0 5px}
input,textarea,button{width:100%;font:inherit;border-radius:11px;border:2px solid var(--line)}
input,textarea{padding:12px;background:#fff;color:var(--ink);font-size:18px}
textarea{min-height:82px;resize:vertical}
button{padding:13px 14px;border:0;background:var(--main);color:#fff;font-weight:900;cursor:pointer;font-size:18px}
button.secondary{background:#637b84} button.accent{background:var(--accent);color:#1f2933} button.warn{background:var(--danger)}
button:disabled{opacity:.55}
.grid{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;align-items:end}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.status{min-height:1.6em;margin:10px 0 0;font-weight:900;color:var(--sub);font-size:17px}
.preview{display:grid;grid-template-columns:120px 1fr;gap:15px;margin-top:16px;padding-top:16px;border-top:2px dashed var(--line)}
.preview img,.book img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#e8edef}
.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-weight:800;padding:10px}
.meta h3{margin:0 0 6px;font-size:21px}.meta p{margin:3px 0;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}
#count{font-weight:900;align-self:center;white-space:nowrap}
#books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.book{padding:13px;display:grid;grid-template-columns:86px 1fr;gap:12px}
.book h3{margin:0;font-size:17px}.book p{margin:2px 0;color:var(--muted);font-size:14px}.book .tags{font-weight:800;color:var(--sub)}
.book button{margin-top:8px;padding:8px;font-size:14px}
.small{font-size:14px;color:var(--muted)}
.manual{margin-top:14px;padding:14px;background:#f0f5f6;border-radius:12px}
.manual summary{font-weight:900;cursor:pointer;font-size:17px}
footer{text-align:center;color:var(--muted);padding:24px 10px 40px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:12px;z-index:100}
.modal.open{display:flex}.modal-card{width:min(560px,100%);background:#fff;border-radius:18px;padding:16px;max-height:94vh;overflow:auto}
#reader{width:100%;min-height:260px;border-radius:12px;overflow:hidden;background:#111;margin:12px 0;transition:.2s}
#reader.scan-ok{outline:6px solid #28a745;box-shadow:0 0 0 8px rgba(40,167,69,.18)}
.scan-toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.96);z-index:200;
background:#1e8449;color:#fff;padding:18px 24px;border-radius:16px;font-weight:900;font-size:22px;
box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.2s;text-align:center}
.scan-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.scanner-help{padding:10px 12px;background:#eef5f6;border-radius:10px;font-weight:700;color:var(--sub)}
.scanner-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scan-result{min-height:1.6em;font-weight:900;color:var(--success);margin:8px 0}
@media(max-width:760px){.grid{grid-template-columns:1fr}.actions,.scanner-actions{grid-template-columns:1fr}.preview{grid-template-columns:92px 1fr}main{padding:12px}header h1{font-size:25px}}
</style>
</head>
<body>
<header><h1>📚 LibraryHub</h1><p>自分の本を、カメラで登録・すぐ検索</p></header>
<main>
<section class="panel">
<h2>本を登録</h2>
<div class="grid">
<div><label for="isbn">ISBN</label><input id="isbn" inputmode="numeric" autocomplete="off" placeholder="978から始まる13桁、または10桁"></div>
<button id="scan" class="accent" type="button">📷 バーコード読取</button>
<button id="lookup" type="button">書誌情報を取得</button>
</div>
<p class="small">カメラを初めて使う時は「許可」を押してください。バーコードの数字を直接入力しても登録できます。</p>
<div id="status" class="status" aria-live="polite"></div>

<div id="preview" class="preview" hidden>
<div id="coverBox" class="placeholder">表紙なし</div>
<div class="meta"><h3 id="title"></h3><p id="authors"></p><p id="publisher"></p><p id="published"></p></div>
</div>

<details class="manual">
<summary>書誌情報が取得できない場合は手入力する</summary>
<label for="manualTitle">タイトル</label><input id="manualTitle" placeholder="本のタイトル">
<label for="manualAuthors">著者</label><input id="manualAuthors" placeholder="著者名">
<label for="manualPublisher">出版社</label><input id="manualPublisher" placeholder="出版社">
<button id="applyManual" class="secondary" type="button" style="margin-top:12px">手入力内容を反映</button>
</details>

<label for="tags">タグ</label><input id="tags" placeholder="例：嚥下、口腔ケア、医学">
<label for="memo">メモ</label><textarea id="memo" placeholder="読んだ内容、保管場所、NotebookLM利用予定など"></textarea>
<div class="actions"><button id="save" type="button" disabled>この本を保存</button><button id="clear" class="secondary" type="button">入力をクリア</button></div>
</section>

<section class="panel">
<h2>本棚</h2>
<div class="toolbar"><input id="search" type="search" placeholder="タイトル・著者・ISBN・タグ・メモで検索"><div id="count">0冊</div></div>
<div id="books"></div>
</section>
</main>
<footer>LibraryHub Ver.1.3 — データはこの端末のブラウザ内に保存されます</footer>

<div id="scanToast" class="scan-toast">✓ ISBNを読み取りました</div>
<div id="scannerModal" class="modal" aria-hidden="true">
<div class="modal-card">
<h2>ISBNバーコードを読み取る</h2>
<div class="scanner-help">本の裏表紙にある上側のバーコードを、横向きに画面中央へ入れてください。</div>
<div id="reader"></div><div id="scanResult" class="scan-result"></div>
<div class="scanner-actions"><button id="switchCamera" class="secondary" type="button">カメラ切替</button><button id="closeScanner" class="warn" type="button">閉じる</button></div>
</div></div>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const e={isbn:$("isbn"),lookup:$("lookup"),scan:$("scan"),status:$("status"),preview:$("preview"),coverBox:$("coverBox"),title:$("title"),authors:$("authors"),publisher:$("publisher"),published:$("published"),tags:$("tags"),memo:$("memo"),save:$("save"),clear:$("clear"),search:$("search"),books:$("books"),count:$("count"),modal:$("scannerModal"),reader:$("reader"),scanResult:$("scanResult"),close:$("closeScanner"),switch:$("switchCamera"),manualTitle:$("manualTitle"),manualAuthors:$("manualAuthors"),manualPublisher:$("manualPublisher"),applyManual:$("applyManual"),scanToast:$("scanToast")};
const KEY="libraryhub_books_v1";
let current=null,scanner=null,cameras=[],cameraIndex=0,running=false,locked=false;
const norm=v=>String(v||"").replace(/[^0-9Xx]/g,"").toUpperCase();
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function status(m,err=false){e.status.textContent=m;e.status.style.color=err?"#b03a2e":"#2c5364"}
function successSound(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  const ctx=new AudioCtx();
  const now=ctx.currentTime;
  const notes=[659.25,783.99,1046.5];
  notes.forEach((freq,i)=>{
   const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type="sine";osc.frequency.setValueAtTime(freq,now+i*0.11);
   gain.gain.setValueAtTime(0.0001,now+i*0.11);
   gain.gain.exponentialRampToValueAtTime(0.18,now+i*0.11+0.015);
   gain.gain.exponentialRampToValueAtTime(0.0001,now+i*0.11+0.16);
   osc.connect(gain).connect(ctx.destination);
   osc.start(now+i*0.11);osc.stop(now+i*0.11+0.18);
  });
  setTimeout(()=>ctx.close().catch(()=>{}),700);
 }catch{}
}
function showScanSuccess(){
 e.reader.classList.add("scan-ok");
 e.scanToast.classList.add("show");
 successSound();
 if(navigator.vibrate)navigator.vibrate([90,40,120]);
 setTimeout(()=>{e.reader.classList.remove("scan-ok");e.scanToast.classList.remove("show")},900);
}
async function fetchCoverInBackground(isbn,book){
 if(book.thumbnail)return;
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),3000);
 try{
  const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${encodeURIComponent(isbn)}&maxResults=5`,{cache:"no-store",signal:controller.signal});
  if(!r.ok)return;
  const d=await r.json();
  const exact=d.items?.find(i=>(i.volumeInfo?.industryIdentifiers||[]).some(x=>norm(x.identifier)===isbn))||d.items?.[0];
  const url=(exact?.volumeInfo?.imageLinks?.thumbnail||exact?.volumeInfo?.imageLinks?.smallThumbnail||"").replace("http://","https://");
  if(url && current && current.isbn===isbn){
    current.thumbnail=url;
    e.coverBox.className="";
    e.coverBox.innerHTML=`<img src="${esc(url)}" alt="表紙">`;
  }
 }catch{}finally{clearTimeout(timer)}
}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x:[]}catch{return[]}}
function store(x){localStorage.setItem(KEY,JSON.stringify(x))}
function showBook(book){
 current=book;e.preview.hidden=false;e.title.textContent=book.title;e.authors.textContent="著者："+(book.authors||"著者不明");
 e.publisher.textContent=book.publisher?"出版社："+book.publisher:"";e.published.textContent=book.publishedDate?"発行："+book.publishedDate:"";
 if(book.thumbnail){e.coverBox.className="";e.coverBox.innerHTML=`<img src="${esc(book.thumbnail)}" alt="表紙">`}else{e.coverBox.className="placeholder";e.coverBox.textContent="表紙なし"}
 e.save.disabled=false;
}
function makeBook(isbn,info){
 return {id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),isbn,title:info.title||"タイトル不明",authors:info.authors||"著者不明",publisher:info.publisher||"",publishedDate:info.publishedDate||"",thumbnail:(info.thumbnail||"").replace("http://","https://"),tags:"",memo:"",createdAt:new Date().toISOString()};
}
async function fromOpenBD(isbn){
 const r=await fetch(`https://api.openbd.jp/v1/get?isbn=${encodeURIComponent(isbn)}`,{cache:"no-store"});
 if(!r.ok) throw new Error("openBD通信失敗");
 const d=await r.json(),x=d&&d[0]; if(!x) throw new Error("openBD該当なし");
 const s=x.summary||{},o=x.onix||{},detail=o.DescriptiveDetail||{},pub=o.PublishingDetail||{};
 const contrib=(detail.Contributor||[]).map(v=>v.PersonName?.content||v.CorporateName?.content).filter(Boolean).join("、");
 const publisher=(pub.Imprint||[])[0]?.ImprintName||s.publisher||"";
 return makeBook(isbn,{title:s.title||"",authors:s.author||contrib,publisher,publishedDate:s.pubdate||"",thumbnail:s.cover||""});
}
async function fromGoogle(isbn){
 const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${encodeURIComponent(isbn)}&maxResults=5`,{cache:"no-store"});
 if(!r.ok) throw new Error("Google Books通信失敗");
 const d=await r.json(); if(!d.items?.length) throw new Error("Google Books該当なし");
 const exact=d.items.find(i=>(i.volumeInfo?.industryIdentifiers||[]).some(x=>norm(x.identifier)===isbn))||d.items[0];
 const v=exact.volumeInfo||{};
 return makeBook(isbn,{title:v.title,authors:Array.isArray(v.authors)?v.authors.join("、"):"",publisher:v.publisher,publishedDate:v.publishedDate,thumbnail:v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail||""});
}
async function lookup(){
 const isbn=norm(e.isbn.value);e.isbn.value=isbn;
 if(![10,13].includes(isbn.length)){status("ISBNは10桁または13桁で入力してください。",true);return}
 e.lookup.disabled=true;status("書誌情報を検索しています…");
 try{
   let book;
   try{book=await fromOpenBD(isbn);status("openBDから書誌情報を取得しました。")}
   catch{book=await fromGoogle(isbn);status("Google Booksから書誌情報を取得しました。")}
   showBook(book);
   fetchCoverInBackground(isbn,book);
 }catch(err){
   current=null;e.preview.hidden=true;e.save.disabled=true;
   status("書誌情報を自動取得できませんでした。下の「手入力」を開いて登録できます。",true);
 }finally{e.lookup.disabled=false}
}
function applyManual(){
 const isbn=norm(e.isbn.value),title=e.manualTitle.value.trim();
 if(![10,13].includes(isbn.length)){status("先にISBNを入力してください。",true);return}
 if(!title){status("タイトルを入力してください。",true);return}
 showBook(makeBook(isbn,{title,authors:e.manualAuthors.value.trim()||"著者不明",publisher:e.manualPublisher.value.trim()}));
 status("手入力内容を反映しました。保存できます。");
}
function add(){
 if(!current)return;const books=load();
 if(books.some(b=>b.isbn===current.isbn)&&!confirm("同じISBNの本があります。もう1冊保存しますか？"))return;
 current.tags=e.tags.value.trim();current.memo=e.memo.value.trim();books.unshift(current);store(books);render();status("本棚に保存しました。");setTimeout(clear,600);
}
function clear(){
 current=null;["isbn","tags","memo","manualTitle","manualAuthors","manualPublisher"].forEach(k=>e[k].value="");
 e.preview.hidden=true;e.coverBox.textContent="表紙なし";e.coverBox.className="placeholder";e.save.disabled=true;status("");
}
function remove(id){if(!confirm("この本を本棚から削除しますか？"))return;store(load().filter(b=>b.id!==id));render()}
function render(){
 const q=e.search.value.trim().toLowerCase(),all=load(),list=all.filter(b=>[b.title,b.authors,b.isbn,b.tags,b.memo,b.publisher].join(" ").toLowerCase().includes(q));
 e.count.textContent=list.length+"冊";
 e.books.innerHTML=list.length?list.map(b=>`<article class="book"><div>${b.thumbnail?`<img src="${esc(b.thumbnail)}" alt="表紙">`:`<div class="placeholder" style="height:115px;background:#e8edef;border-radius:10px">表紙なし</div>`}</div><div><h3>${esc(b.title)}</h3><p>${esc(b.authors)}</p><p>ISBN：${esc(b.isbn)}</p>${b.tags?`<p class="tags"># ${esc(b.tags)}</p>`:""}${b.memo?`<p>${esc(b.memo)}</p>`:""}<button class="warn" data-delete="${esc(b.id)}">削除</button></div></article>`).join(""):`<div class="small">${q?"該当する本がありません。":"まだ本が登録されていません。"}</div>`;
}
async function openScanner(){
 if(typeof Html5Qrcode==="undefined"){status("読取機能の読み込みに失敗しました。ページを再読み込みしてください。",true);return}
 e.modal.classList.add("open");e.modal.setAttribute("aria-hidden","false");e.scanResult.textContent="カメラを準備しています…";locked=false;
 try{
  cameras=await Html5Qrcode.getCameras();if(!cameras.length)throw new Error("カメラが見つかりません");
  cameraIndex=Math.max(0,cameras.findIndex(c=>/back|rear|environment|背面/i.test(c.label)));
  scanner=scanner||new Html5Qrcode("reader");await startCamera();
 }catch(err){e.scanResult.textContent="カメラを開始できません。iPhoneの設定でSafariのカメラを許可してください。";status("カメラを利用できません。ISBNを数字入力してください。",true)}
}
async function startCamera(){
 if(running){try{await scanner.stop()}catch{}running=false}
 await scanner.start({facingMode:"environment"},{fps:12,qrbox:{width:300,height:150},aspectRatio:1.7778,formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]},async text=>{
  if(locked)return;const code=norm(text);if(code.length!==13||!code.startsWith("978"))return;locked=true;e.isbn.value=code;e.scanResult.textContent="読取成功："+code;showScanSuccess();setTimeout(async()=>{await closeScanner();lookup()},550);
 },()=>{});
 running=true;
}
async function closeScanner(){if(scanner&&running){try{await scanner.stop();await scanner.clear()}catch{}}running=false;e.modal.classList.remove("open");e.modal.setAttribute("aria-hidden","true");e.reader.innerHTML=""}
async function switchCamera(){if(cameras.length<2){e.scanResult.textContent="別のカメラがありません。";return}cameraIndex=(cameraIndex+1)%cameras.length;try{if(running)await scanner.stop();running=false;await scanner.start(cameras[cameraIndex].id,{fps:12,qrbox:{width:300,height:150},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]},async t=>{const c=norm(t);if(c.length===13){e.isbn.value=c;showScanSuccess();setTimeout(async()=>{await closeScanner();lookup()},550)}},()=>{});running=true}catch{e.scanResult.textContent="切替に失敗しました。"}}
e.lookup.onclick=lookup;e.scan.onclick=openScanner;e.applyManual.onclick=applyManual;e.save.onclick=add;e.clear.onclick=clear;e.search.oninput=render;e.close.onclick=closeScanner;e.switch.onclick=switchCamera;
e.isbn.addEventListener("keydown",x=>{if(x.key==="Enter")lookup()});e.books.onclick=x=>{const id=x.target.dataset.delete;if(id)remove(id)};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running)closeScanner()});render();
})();
</script>
</body>
</html>
