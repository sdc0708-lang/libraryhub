<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#203a43" />
  <title>LibraryHub</title>
  <style>
    :root{
      --bg:#f4f7f6; --card:#ffffff; --ink:#17202a; --muted:#566573;
      --main:#203a43; --sub:#2c5364; --accent:#e6a23c; --line:#d7e0e3;
      --danger:#b03a2e;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:"Yu Gothic UI","Meiryo",sans-serif; line-height:1.6;
    }
    header{
      padding:22px 18px; color:#fff;
      background:linear-gradient(135deg,var(--main),var(--sub));
      position:sticky; top:0; z-index:10;
      box-shadow:0 3px 12px rgba(0,0,0,.16);
    }
    header h1{margin:0;font-size:28px;letter-spacing:.02em}
    header p{margin:2px 0 0;font-weight:700;opacity:.9}
    main{width:min(980px,100%);margin:auto;padding:18px}
    .panel,.book{
      background:var(--card); border:1px solid var(--line); border-radius:16px;
      box-shadow:0 4px 16px rgba(31,52,59,.08);
    }
    .panel{padding:18px;margin-bottom:18px}
    h2{margin:0 0 12px;font-size:21px}
    label{display:block;font-weight:800;margin:10px 0 5px}
    input,textarea,button{
      width:100%; font:inherit; border-radius:11px; border:2px solid var(--line);
    }
    input,textarea{padding:12px;background:#fff;color:var(--ink)}
    input:focus,textarea:focus{outline:3px solid rgba(44,83,100,.18);border-color:var(--sub)}
    textarea{min-height:82px;resize:vertical}
    button{
      padding:12px 14px;border:0;background:var(--main);color:#fff;
      font-weight:900;cursor:pointer;
    }
    button.secondary{background:#637b84}
    button.warn{background:var(--danger)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .status{min-height:1.6em;margin:10px 0 0;font-weight:800;color:var(--sub)}
    .preview{
      display:grid;grid-template-columns:120px 1fr;gap:15px;margin-top:16px;
      padding-top:16px;border-top:2px dashed var(--line)
    }
    .preview img,.book img{
      width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#e8edef
    }
    .placeholder{display:flex;align-items:center;justify-content:center;text-align:center;
      color:var(--muted);font-weight:800;padding:10px}
    .meta h3{margin:0 0 6px;font-size:20px}
    .meta p{margin:3px 0;color:var(--muted)}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}
    #count{font-weight:900;align-self:center;white-space:nowrap}
    #books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .book{padding:13px;display:grid;grid-template-columns:86px 1fr;gap:12px}
    .book h3{margin:0;font-size:17px}
    .book p{margin:2px 0;color:var(--muted);font-size:14px}
    .book .tags{font-weight:800;color:var(--sub)}
    .book button{margin-top:8px;padding:8px;font-size:14px}
    .small{font-size:13px;color:var(--muted)}
    footer{text-align:center;color:var(--muted);padding:24px 10px 40px;font-weight:700}
    @media(max-width:600px){
      header h1{font-size:24px}
      main{padding:12px}
      .row{grid-template-columns:1fr}
      .actions{grid-template-columns:1fr}
      .preview{grid-template-columns:92px 1fr}
    }
  </style>
</head>
<body>
<header>
  <h1>📚 LibraryHub</h1>
  <p>自分の本を、すぐ登録・検索</p>
</header>

<main>
  <section class="panel">
    <h2>本を登録</h2>
    <div class="row">
      <div>
        <label for="isbn">ISBN</label>
        <input id="isbn" inputmode="numeric" autocomplete="off"
          placeholder="978から始まる13桁、または10桁" />
      </div>
      <button id="lookup" type="button">書誌情報を取得</button>
    </div>
    <p class="small">ISBNのハイフンは入っていても構いません。</p>
    <div id="status" class="status" aria-live="polite"></div>

    <div id="preview" class="preview" hidden>
      <div id="coverBox" class="placeholder">表紙なし</div>
      <div class="meta">
        <h3 id="title"></h3>
        <p id="authors"></p>
        <p id="publisher"></p>
        <p id="published"></p>
      </div>
    </div>

    <label for="tags">タグ</label>
    <input id="tags" placeholder="例：嚥下、口腔ケア、医学" />

    <label for="memo">メモ</label>
    <textarea id="memo" placeholder="読んだ内容、保管場所、NotebookLM利用予定など"></textarea>

    <div class="actions">
      <button id="save" type="button" disabled>この本を保存</button>
      <button id="clear" class="secondary" type="button">入力をクリア</button>
    </div>
  </section>

  <section class="panel">
    <h2>本棚</h2>
    <div class="toolbar">
      <input id="search" type="search" placeholder="タイトル・著者・ISBN・タグ・メモで検索" />
      <div id="count">0冊</div>
    </div>
    <div id="books"></div>
  </section>
</main>

<footer>LibraryHub Ver.1 — データはこの端末のブラウザ内に保存されます</footer>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const els = {
    isbn:$("isbn"), lookup:$("lookup"), status:$("status"), preview:$("preview"),
    coverBox:$("coverBox"), title:$("title"), authors:$("authors"),
    publisher:$("publisher"), published:$("published"), tags:$("tags"),
    memo:$("memo"), save:$("save"), clear:$("clear"), search:$("search"),
    books:$("books"), count:$("count")
  };

  const STORAGE_KEY = "libraryhub_books_v1";
  let currentBook = null;

  const normalizeIsbn = value => value.replace(/[^0-9Xx]/g, "").toUpperCase();

  function loadBooks() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  function saveBooks(books) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
  }

  function setStatus(message, isError=false) {
    els.status.textContent = message;
    els.status.style.color = isError ? "#b03a2e" : "#2c5364";
  }

  function escapeHtml(value="") {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[ch]));
  }

  function clearForm() {
    currentBook = null;
    els.isbn.value = "";
    els.tags.value = "";
    els.memo.value = "";
    els.preview.hidden = true;
    els.coverBox.innerHTML = "表紙なし";
    els.coverBox.className = "placeholder";
    els.title.textContent = "";
    els.authors.textContent = "";
    els.publisher.textContent = "";
    els.published.textContent = "";
    els.save.disabled = true;
    setStatus("");
    els.isbn.focus();
  }

  async function lookupBook() {
    const isbn = normalizeIsbn(els.isbn.value);
    if (![10,13].includes(isbn.length)) {
      setStatus("ISBNは10桁または13桁で入力してください。", true);
      return;
    }

    els.lookup.disabled = true;
    setStatus("書誌情報を検索しています…");

    try {
      const response = await fetch(
        `https://www.googleapis.com/books/v1/volumes?q=isbn:${encodeURIComponent(isbn)}`
      );
      if (!response.ok) throw new Error("通信エラー");
      const data = await response.json();
      if (!data.items || data.items.length === 0) {
        throw new Error("このISBNの本が見つかりませんでした。");
      }

      const info = data.items[0].volumeInfo || {};
      currentBook = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        isbn,
        title: info.title || "タイトル不明",
        authors: Array.isArray(info.authors) ? info.authors.join("、") : "著者不明",
        publisher: info.publisher || "",
        publishedDate: info.publishedDate || "",
        thumbnail: (info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || "")
          .replace("http://","https://"),
        tags: "",
        memo: "",
        createdAt: new Date().toISOString()
      };

      els.preview.hidden = false;
      els.title.textContent = currentBook.title;
      els.authors.textContent = `著者：${currentBook.authors}`;
      els.publisher.textContent = currentBook.publisher ? `出版社：${currentBook.publisher}` : "";
      els.published.textContent = currentBook.publishedDate ? `発行：${currentBook.publishedDate}` : "";

      if (currentBook.thumbnail) {
        els.coverBox.className = "";
        els.coverBox.innerHTML = `<img src="${escapeHtml(currentBook.thumbnail)}" alt="表紙">`;
      } else {
        els.coverBox.className = "placeholder";
        els.coverBox.textContent = "表紙なし";
      }

      els.save.disabled = false;
      setStatus("書誌情報を取得しました。タグやメモを追加して保存できます。");
    } catch (error) {
      currentBook = null;
      els.preview.hidden = true;
      els.save.disabled = true;
      setStatus(error.message || "書誌情報を取得できませんでした。", true);
    } finally {
      els.lookup.disabled = false;
    }
  }

  function addBook() {
    if (!currentBook) return;
    const books = loadBooks();
    const duplicate = books.some(b => b.isbn === currentBook.isbn);
    if (duplicate && !confirm("同じISBNの本がすでにあります。もう1冊保存しますか？")) return;

    currentBook.tags = els.tags.value.trim();
    currentBook.memo = els.memo.value.trim();
    books.unshift(currentBook);
    saveBooks(books);
    renderBooks();
    setStatus("本棚に保存しました。");
    setTimeout(clearForm, 700);
  }

  function removeBook(id) {
    if (!confirm("この本を本棚から削除しますか？")) return;
    const books = loadBooks().filter(book => book.id !== id);
    saveBooks(books);
    renderBooks();
  }

  function renderBooks() {
    const query = els.search.value.trim().toLowerCase();
    const all = loadBooks();
    const filtered = all.filter(book =>
      [book.title, book.authors, book.isbn, book.tags, book.memo, book.publisher]
        .join(" ").toLowerCase().includes(query)
    );

    els.count.textContent = `${filtered.length}冊`;
    if (filtered.length === 0) {
      els.books.innerHTML = `<div class="small">${query ? "該当する本がありません。" : "まだ本が登録されていません。"}</div>`;
      return;
    }

    els.books.innerHTML = filtered.map(book => `
      <article class="book">
        <div>
          ${book.thumbnail
            ? `<img src="${escapeHtml(book.thumbnail)}" alt="表紙">`
            : `<div class="placeholder" style="height:115px;background:#e8edef;border-radius:10px">表紙なし</div>`}
        </div>
        <div>
          <h3>${escapeHtml(book.title)}</h3>
          <p>${escapeHtml(book.authors)}</p>
          <p>ISBN：${escapeHtml(book.isbn)}</p>
          ${book.tags ? `<p class="tags"># ${escapeHtml(book.tags)}</p>` : ""}
          ${book.memo ? `<p>${escapeHtml(book.memo)}</p>` : ""}
          <button class="warn" type="button" data-delete="${escapeHtml(book.id)}">削除</button>
        </div>
      </article>
    `).join("");
  }

  els.lookup.addEventListener("click", lookupBook);
  els.isbn.addEventListener("keydown", e => {
    if (e.key === "Enter") lookupBook();
  });
  els.save.addEventListener("click", addBook);
  els.clear.addEventListener("click", clearForm);
  els.search.addEventListener("input", renderBooks);
  els.books.addEventListener("click", e => {
    const id = e.target.dataset.delete;
    if (id) removeBook(id);
  });

  renderBooks();
})();
</script>
</body>
</html>
