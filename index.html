<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315d50">
  <title>LibraryHub</title>
  <style>
    :root{
      --ink:#24312d;
      --muted:#66736e;
      --paper:#fffdf8;
      --green:#315d50;
      --green2:#dfece5;
      --gold:#c08b3c;
      --line:#d9dfdb;
      --danger:#a4473d;
      --shadow:0 10px 28px rgba(38,60,52,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#faf8f1,#f1eee5);
      line-height:1.55;
    }
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .wrap{max-width:980px;margin:auto;padding:18px}
    header{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      margin-bottom:16px;
    }
    .brand h1{margin:0;font-size:28px}
    .brand p{margin:2px 0 0;color:var(--muted)}
    .badge{padding:7px 11px;border-radius:999px;background:var(--green2);color:var(--green);font-weight:800;font-size:13px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .tab{
      border:1px solid var(--line);background:#fff;border-radius:999px;
      padding:10px 14px;font-weight:800;color:var(--ink)
    }
    .tab.active{background:var(--green);color:#fff;border-color:var(--green)}
    .panel{
      display:none;background:rgba(255,255,255,.92);border:1px solid var(--line);
      border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)
    }
    .panel.active{display:block}
    .field{margin:14px 0}
    label{display:block;font-weight:800;margin-bottom:6px}
    input,textarea,select{
      width:100%;padding:13px 14px;border:1px solid #cfd7d2;
      border-radius:12px;background:#fff;color:var(--ink)
    }
    textarea{min-height:90px;resize:vertical}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(49,93,80,.12)}
    .row{display:grid;grid-template-columns:1fr auto;gap:8px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn{
      border:0;border-radius:12px;padding:12px 16px;font-weight:800;
      display:inline-flex;align-items:center;justify-content:center;gap:6px
    }
    .primary{background:var(--green);color:#fff}
    .secondary{background:#edf2ef;color:var(--green)}
    .danger{background:#fff1ef;color:var(--danger);border:1px solid #edc7c1}
    .outline{background:#fff;color:var(--green);border:1px solid var(--green)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .note{padding:12px 14px;border-radius:12px;background:#fff8e9;border-left:4px solid var(--gold);font-size:14px}
    .preview{
      display:grid;grid-template-columns:120px 1fr;gap:16px;margin-top:18px;
      padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff
    }
    .cover{
      width:120px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#eef1ef;
      border:1px solid var(--line)
    }
    .preview h3{margin:0 0 8px}
    .meta{color:var(--muted);margin:4px 0}
    .shelf-toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:14px}
    .books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .book{
      display:grid;grid-template-columns:82px 1fr;gap:12px;background:#fff;
      border:1px solid var(--line);border-radius:14px;padding:12px
    }
    .book img{width:82px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#eef1ef}
    .book h3{font-size:17px;margin:0 0 5px;line-height:1.35}
    .book p{margin:3px 0;color:var(--muted);font-size:14px}
    .book .mini-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .mini{padding:7px 10px;border-radius:9px;border:0;font-weight:800}
    .empty{text-align:center;color:var(--muted);padding:34px 10px}
    .count{font-weight:800;color:var(--green)}
    .hidden{display:none!important}
    video{width:100%;max-height:360px;border-radius:14px;background:#000}
    .scanner-box{margin-top:14px}
    footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 0 10px}
    @media(max-width:640px){
      .wrap{padding:12px 12px 90px}
      header{align-items:flex-start}
      .grid2,.shelf-toolbar{grid-template-columns:1fr}
      .preview{grid-template-columns:92px 1fr}
      .cover{width:92px}
      .tabs{
        position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;
        background:rgba(255,255,255,.97);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
        border-top:1px solid var(--line);justify-content:space-around
      }
      .tab{flex:1;padding:10px 8px;font-size:14px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>📚 LibraryHub</h1>
      <p>ISBNで登録する、私の蔵書管理</p>
    </div>
    <div class="badge">Ver.1α</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="register">登録</button>
    <button class="tab" data-tab="shelf">本棚</button>
    <button class="tab" data-tab="settings">設定</button>
  </nav>

  <section id="register" class="panel active">
    <h2>本を登録</h2>
    <div class="field">
      <label for="isbn">ISBN</label>
      <div class="row">
        <input id="isbn" inputmode="numeric" autocomplete="off" placeholder="978から始まるISBNを入力">
        <button id="lookupBtn" class="btn primary">検索</button>
      </div>
    </div>

    <div class="actions">
      <button id="scanBtn" class="btn outline">📷 バーコードを読む</button>
      <button id="manualBtn" class="btn secondary">手入力</button>
    </div>

    <div id="scannerBox" class="scanner-box hidden">
      <video id="video" playsinline></video>
      <div class="actions">
        <button id="stopScanBtn" class="btn danger">カメラを止める</button>
      </div>
    </div>

    <div class="note" style="margin-top:14px">
      カメラ読取は対応ブラウザで利用できます。うまくいかない場合はISBNを手入力してください。
    </div>

    <div id="bookForm" class="hidden">
      <div class="preview">
        <img id="coverPreview" class="cover" alt="表紙">
        <div>
          <h3 id="previewTitle">書名</h3>
          <p id="previewAuthor" class="meta"></p>
          <p id="previewPublisher" class="meta"></p>
          <p id="previewIsbn" class="meta"></p>
        </div>
      </div>

      <div class="field">
        <label for="title">書名</label>
        <input id="title">
      </div>
      <div class="field">
        <label for="authors">著者</label>
        <input id="authors">
      </div>
      <div class="grid2">
        <div class="field">
          <label for="publisher">出版社</label>
          <input id="publisher">
        </div>
        <div class="field">
          <label for="publishedDate">出版日</label>
          <input id="publishedDate">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="tags">タグ</label>
          <input id="tags" placeholder="例：嚥下, 歯科, 栄養">
        </div>
        <div class="field">
          <label for="location">保管場所</label>
          <input id="location" placeholder="例：診療室本棚A">
        </div>
      </div>
      <div class="field">
        <label for="memo">メモ</label>
        <textarea id="memo" placeholder="読書メモ、購入理由、NotebookLM利用予定など"></textarea>
      </div>
      <input id="thumbnail" type="hidden">
      <input id="editingId" type="hidden">

      <div class="actions">
        <button id="saveBtn" class="btn primary">この本を保存</button>
        <button id="cancelBtn" class="btn secondary">キャンセル</button>
      </div>
    </div>
  </section>

  <section id="shelf" class="panel">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px">
      <div>
        <h2 style="margin-bottom:2px">本棚</h2>
        <div><span id="bookCount" class="count">0冊</span></div>
      </div>
    </div>

    <div class="shelf-toolbar">
      <input id="searchInput" placeholder="書名・著者・タグ・メモを検索">
      <select id="sortSelect">
        <option value="newest">登録が新しい順</option>
        <option value="title">書名順</option>
        <option value="author">著者順</option>
      </select>
    </div>

    <div id="books" class="books"></div>
    <div id="emptyShelf" class="empty">まだ本が登録されていません。</div>
  </section>

  <section id="settings" class="panel">
    <h2>設定・データ管理</h2>
    <p class="note">現在はこのブラウザ内に保存します。Googleスプレッドシート連携は次の版で追加します。</p>

    <div class="actions">
      <button id="exportBtn" class="btn outline">JSONを書き出す</button>
      <label class="btn secondary" for="importFile">JSONを読み込む</label>
      <input id="importFile" class="hidden" type="file" accept=".json,application/json">
      <button id="clearBtn" class="btn danger">全データ削除</button>
    </div>
  </section>

  <footer>LibraryHub｜ブラウザ内保存版</footer>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const STORAGE_KEY = 'libraryhub_books_v1';
  let books = loadBooks();
  let stream = null;
  let scanTimer = null;

  function loadBooks(){
    try{return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []}catch{return []}
  }
  function saveBooks(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
    renderShelf();
  }
  function uid(){return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)}
  function cleanIsbn(v){return String(v||'').replace(/[^0-9Xx]/g,'')}

  $$('.tab').forEach(btn => btn.addEventListener('click', () => {
    $$('.tab').forEach(x=>x.classList.remove('active'));
    $$('.panel').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    $('#'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='shelf') renderShelf();
  }));

  $('#lookupBtn').addEventListener('click', lookupIsbn);
  $('#isbn').addEventListener('keydown', e => { if(e.key==='Enter') lookupIsbn(); });
  $('#manualBtn').addEventListener('click', () => openForm({isbn:cleanIsbn($('#isbn').value)}));
  $('#cancelBtn').addEventListener('click', resetForm);
  $('#saveBtn').addEventListener('click', saveCurrentBook);
  $('#scanBtn').addEventListener('click', startScanner);
  $('#stopScanBtn').addEventListener('click', stopScanner);
  $('#searchInput').addEventListener('input', renderShelf);
  $('#sortSelect').addEventListener('change', renderShelf);

  async function lookupIsbn(){
    const isbn = cleanIsbn($('#isbn').value);
    if(isbn.length < 10){ alert('ISBNを10桁または13桁で入力してください。'); return; }
    $('#lookupBtn').disabled = true;
    $('#lookupBtn').textContent = '検索中…';
    try{
      const res = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn));
      if(!res.ok) throw new Error('通信エラー');
      const data = await res.json();
      if(!data.items?.length){
        if(confirm('書誌情報が見つかりませんでした。手入力で登録しますか？')) openForm({isbn});
        return;
      }
      const info = data.items[0].volumeInfo || {};
      openForm({
        isbn,
        title: info.title || '',
        authors: (info.authors || []).join(', '),
        publisher: info.publisher || '',
        publishedDate: info.publishedDate || '',
        thumbnail: (info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || '').replace('http://','https://'),
        tags: (info.categories || []).join(', '),
        location:'',
        memo:''
      });
    }catch(err){
      alert('書誌情報を取得できませんでした。通信状態を確認してください。');
    }finally{
      $('#lookupBtn').disabled = false;
      $('#lookupBtn').textContent = '検索';
    }
  }

  function openForm(book={}){
    $('#bookForm').classList.remove('hidden');
    $('#isbn').value = book.isbn || '';
    $('#title').value = book.title || '';
    $('#authors').value = book.authors || '';
    $('#publisher').value = book.publisher || '';
    $('#publishedDate').value = book.publishedDate || '';
    $('#tags').value = book.tags || '';
    $('#location').value = book.location || '';
    $('#memo').value = book.memo || '';
    $('#thumbnail').value = book.thumbnail || '';
    $('#editingId').value = book.id || '';
    updatePreview();
    ['title','authors','publisher','publishedDate'].forEach(id => $('#'+id).addEventListener('input', updatePreview, {once:false}));
    $('#saveBtn').textContent = book.id ? '変更を保存' : 'この本を保存';
    window.scrollTo({top:$('#bookForm').offsetTop-20,behavior:'smooth'});
  }

  function updatePreview(){
    const thumb = $('#thumbnail').value;
    $('#coverPreview').src = thumb || 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#eef1ef"/><text x="50%" y="50%" text-anchor="middle" fill="#66736e" font-size="30">NO COVER</text></svg>');
    $('#previewTitle').textContent = $('#title').value || '書名未入力';
    $('#previewAuthor').textContent = $('#authors').value || '著者未入力';
    $('#previewPublisher').textContent = [$('#publisher').value,$('#publishedDate').value].filter(Boolean).join('／');
    $('#previewIsbn').textContent = 'ISBN：'+($('#isbn').value || '未入力');
  }

  function saveCurrentBook(){
    const title = $('#title').value.trim();
    if(!title){alert('書名を入力してください。');return;}
    const id = $('#editingId').value;
    const book = {
      id: id || uid(),
      isbn: cleanIsbn($('#isbn').value),
      title,
      authors: $('#authors').value.trim(),
      publisher: $('#publisher').value.trim(),
      publishedDate: $('#publishedDate').value.trim(),
      tags: $('#tags').value.trim(),
      location: $('#location').value.trim(),
      memo: $('#memo').value.trim(),
      thumbnail: $('#thumbnail').value,
      createdAt: id ? (books.find(b=>b.id===id)?.createdAt || new Date().toISOString()) : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    if(id){
      const i = books.findIndex(b=>b.id===id);
      if(i>=0) books[i]=book;
    }else{
      const duplicate = books.find(b=>b.isbn && b.isbn===book.isbn);
      if(duplicate && !confirm('同じISBNの本がすでに登録されています。重複して保存しますか？')) return;
      books.unshift(book);
    }
    saveBooks();
    resetForm();
    switchTab('shelf');
  }

  function resetForm(){
    $('#bookForm').classList.add('hidden');
    $('#bookForm').querySelectorAll('input,textarea').forEach(el=>el.value='');
    $('#saveBtn').textContent='この本を保存';
  }

  function switchTab(name){
    const btn = $(`.tab[data-tab="${name}"]`);
    if(btn) btn.click();
  }

  function renderShelf(){
    const q = $('#searchInput').value.trim().toLowerCase();
    const sort = $('#sortSelect').value;
    let list = books.filter(b => [b.title,b.authors,b.publisher,b.tags,b.location,b.memo,b.isbn].join(' ').toLowerCase().includes(q));
    list.sort((a,b)=>{
      if(sort==='title') return a.title.localeCompare(b.title,'ja');
      if(sort==='author') return (a.authors||'').localeCompare(b.authors||'','ja');
      return (b.createdAt||'').localeCompare(a.createdAt||'');
    });
    $('#bookCount').textContent = books.length+'冊';
    $('#emptyShelf').classList.toggle('hidden', list.length>0);
    $('#books').innerHTML = list.map(b=>`
      <article class="book">
        <img src="${escapeHtml(b.thumbnail || placeholder())}" alt="">
        <div>
          <h3>${escapeHtml(b.title)}</h3>
          <p>${escapeHtml(b.authors || '著者未入力')}</p>
          <p>${escapeHtml([b.publisher,b.publishedDate].filter(Boolean).join('／'))}</p>
          ${b.tags ? `<p>🏷 ${escapeHtml(b.tags)}</p>` : ''}
          ${b.location ? `<p>📍 ${escapeHtml(b.location)}</p>` : ''}
          <div class="mini-actions">
            <button class="mini secondary" onclick="window.editBook('${b.id}')">編集</button>
            <button class="mini danger" onclick="window.deleteBook('${b.id}')">削除</button>
          </div>
        </div>
      </article>
    `).join('');
  }

  function placeholder(){
    return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#eef1ef"/><text x="50%" y="50%" text-anchor="middle" fill="#66736e" font-size="30">NO COVER</text></svg>');
  }
  function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  window.editBook = id => {
    const b = books.find(x=>x.id===id);
    if(!b)return;
    switchTab('register');
    openForm(b);
  };
  window.deleteBook = id => {
    const b = books.find(x=>x.id===id);
    if(!b)return;
    if(confirm(`「${b.title}」を削除しますか？`)){
      books = books.filter(x=>x.id!==id);
      saveBooks();
    }
  };

  async function startScanner(){
    if(!('BarcodeDetector' in window)){
      alert('このブラウザではバーコード自動読取に対応していません。ISBNを手入力してください。');
      return;
    }
    try{
      const formats = await BarcodeDetector.getSupportedFormats();
      const detector = new BarcodeDetector({formats: formats.includes('ean_13') ? ['ean_13'] : formats});
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      $('#video').srcObject = stream;
      await $('#video').play();
      $('#scannerBox').classList.remove('hidden');
      const scan = async()=>{
        if(!stream)return;
        try{
          const codes = await detector.detect($('#video'));
          const code = codes.find(c=>/^97[89]\d{10}$/.test(cleanIsbn(c.rawValue)));
          if(code){
            $('#isbn').value = cleanIsbn(code.rawValue);
            stopScanner();
            lookupIsbn();
            return;
          }
        }catch{}
        scanTimer = setTimeout(scan,450);
      };
      scan();
    }catch{
      alert('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。');
      stopScanner();
    }
  }

  function stopScanner(){
    clearTimeout(scanTimer);
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    $('#video').srcObject=null;
    $('#scannerBox').classList.add('hidden');
  }

  $('#exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(books,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='libraryhub_backup_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('#importFile').addEventListener('change', async e=>{
    const file=e.target.files[0];
    if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      if(!Array.isArray(data))throw new Error();
      if(confirm(`${data.length}冊のデータを読み込みます。現在のデータに追加しますか？`)){
        const map=new Map(books.map(b=>[b.id,b]));
        data.forEach(b=>map.set(b.id||uid(),b));
        books=[...map.values()];
        saveBooks();
      }
    }catch{alert('正しいLibraryHubのJSONファイルではありません。')}
    e.target.value='';
  });

  $('#clearBtn').addEventListener('click', ()=>{
    if(confirm('登録した本をすべて削除します。元に戻せません。')){
      books=[];saveBooks();
    }
  });

  renderShelf();
})();
</script>
</body>
</html>
